# Metriks
# by KryKom with love and care :)

name: Test Metriks

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest
    
    env:
      SolutionName: ./Metriks.slnx
      ProjectPath: ./Src/Metriks/Metriks.csproj
      TestProjectPath: ./Tests/Metriks.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SolutionName }} --ignore-failed-sources

      - name: Build project
        run: dotnet build ${{ env.ProjectPath }} --configuration ${{ matrix.configuration }} --no-restore

      - name: Build test project
        run: dotnet build ${{ env.TestProjectPath }} --configuration ${{ matrix.configuration }} --no-restore

      - name: Execute unit tests
        run: dotnet test ${{ env.TestProjectPath }} --configuration ${{ matrix.configuration }} --no-build